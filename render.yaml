services:
  - type: web
    name: cyberrakshak-campus-trustdesk
    env: node
    plan: free
    buildCommand: npm run build:all
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false


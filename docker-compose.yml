version: '3.8'

services:
  cyberrakshak:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberrakshak-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=cyberrakshak_campus_trustdesk_jwt_secret_key_2026
      - MONGODB_URI=mongodb://mongo:27017/cyberrakshak
      - GEMINI_API_KEY=
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: cyberrakshak-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

